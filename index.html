<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cab Booking System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
header{background:#0b5ed7;color:#fff;text-align:center;padding:12px}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:8px}
input,select,button{padding:7px;margin:5px 0;width:100%}
button{background:#198754;color:#fff;border:none;cursor:pointer}
button:hover{opacity:0.9}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:left}
th{background:#eee}
.tab-btn{background:#6c757d;margin-right:5px}
.active{background:#0b5ed7}
.hidden{display:none}
.status{font-weight:bold}
</style>
</head>

<body>

<header>
<h2>🚖 Jeyam Travels – Booking System</h2>
</header>

<div class="container">

<!-- NAV -->
<button class="tab-btn active" onclick="showTab('customer')">Customer Dashboard</button>
<button class="tab-btn" onclick="showTab('admin')">Admin Dashboard</button>

<!-- CUSTOMER DASHBOARD -->
<div id="customer" class="card">
<h3>👤 Customer Dashboard</h3>

<h4>Book a Cab</h4>
<input id="c_name" placeholder="Name">
<input id="c_mobile" placeholder="Mobile">
<input id="c_pickup" placeholder="Pickup">
<input id="c_drop" placeholder="Drop">
<input id="c_date" type="date">
<select id="c_cab">
<option value="">Cab Type</option>
<option value="Mini">Mini</option>
<option value="Sedan">Sedan</option>
<option value="SUV">SUV</option>
</select>
<input id="c_km" placeholder="KM">

<button onclick="addBooking()">Book Now</button>

<h4>My Bookings</h4>
<table>
<thead>
<tr>
<th>ID</th><th>Date</th><th>Route</th><th>Cab</th><th>Status</th>
</tr>
</thead>
<tbody id="customerBookings"></tbody>
</table>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin" class="card hidden">
<h3>🧑‍💼 Admin Dashboard</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Route</th>
<th>Cab</th>
<th>Status</th>
<th>Driver</th>
<th>Vehicle</th>
<th>Action</th>
</tr>
</thead>
<tbody id="adminBookings"></tbody>
</table>
</div>

</div>

<script>
let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

function showTab(tab){
  document.getElementById("customer").classList.add("hidden");
  document.getElementById("admin").classList.add("hidden");
  document.getElementById(tab).classList.remove("hidden");
}

function addBooking(){
  const b = {
    id: Date.now(),
    name: c_name.value,
    mobile: c_mobile.value,
    pickup: c_pickup.value,
    drop: c_drop.value,
    date: c_date.value,
    cab: c_cab.value,
    km: c_km.value,
    status: "Pending",
    driver: "",
    vehicle: ""
  };

  if(!b.name || !b.mobile || !b.pickup || !b.drop || !b.date || !b.cab){
    alert("Fill all details");
    return;
  }

  bookings.push(b);
  localStorage.setItem("bookings", JSON.stringify(bookings));
  alert("Booking Created");
  render();
}

function render(){
  customerBookings.innerHTML = "";
  adminBookings.innerHTML = "";

  bookings.forEach(b=>{
    customerBookings.innerHTML += `
      <tr>
        <td>${b.id}</td>
        <td>${b.date}</td>
        <td>${b.pickup} → ${b.drop}</td>
        <td>${b.cab}</td>
        <td class="status">${b.status}</td>
      </tr>
    `;

    adminBookings.innerHTML += `
      <tr>
        <td>${b.id}</td>
        <td>${b.name}<br>${b.mobile}</td>
        <td>${b.pickup} → ${b.drop}</td>
        <td>${b.cab}</td>
        <td>${b.status}</td>
        <td><input value="${b.driver}" onchange="update(${b.id},'driver',this.value)"></td>
        <td><input value="${b.vehicle}" onchange="update(${b.id},'vehicle',this.value)"></td>
        <td>
          <select onchange="update(${b.id},'status',this.value)">
            <option ${b.status=='Pending'?'selected':''}>Pending</option>
            <option ${b.status=='Confirmed'?'selected':''}>Confirmed</option>
            <option ${b.status=='Completed'?'selected':''}>Completed</option>
          </select>
        </td>
      </tr>
    `;
  });
}

function update(id, field, value){
  const b = bookings.find(x=>x.id==id);
  b[field] = value;
  localStorage.setItem("bookings", JSON.stringify(bookings));
  render();
}

render();
</script>

</body>
</html>
